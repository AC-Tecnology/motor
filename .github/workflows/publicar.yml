# Publica el short de cada franja (12:00 y 19:00, hora de Ecuador) aunque el equipo local esté apagado.
# Claude Code decide (noticia del día o cola), produce el video si hace falta, publica en Instagram y registra en el cerebro.
name: Publicar short

on:
  schedule:
    # GitHub retrasa o descarta los cron en punto (horas de mucha carga): minutos sueltos y un respaldo
    # una hora después que solo publica si la franja aún no está en el registro del día.
    - cron: "37 15 * * *"  # 10:37 Ecuador → franja 12
    - cron: "41 16 * * *"  # 11:41 Ecuador → respaldo franja 12
    - cron: "37 22 * * *"  # 17:37 Ecuador → franja 19
    - cron: "41 23 * * *"  # 18:41 Ecuador → respaldo franja 19
  workflow_dispatch:
    inputs:
      franja:
        description: "Franja (12 o 19)"
        default: "12"
      forzar:
        description: "si = publicar aunque la franja ya figure en el registro"
        default: "no"

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    outputs:
      hecho: ${{ steps.registro.outputs.hecho }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATOS_REPO }}
          token: ${{ secrets.DATOS_PAT }}
      # runs after any earlier run of the day (same concurrency group), so its registro is already pushed
      - id: registro
        env:
          FRANJA: ${{ github.event.inputs.franja || (contains(github.event.schedule, ' 15 ') || contains(github.event.schedule, ' 16 ')) && '12' || '19' }}
        run: |
          f="automatizacion/registro/$(TZ=America/Guayaquil date +%F).md"
          # the same slot may be woken by GitHub's cron and by cron-job.org: only the first one publishes
          if [ "${{ github.event.inputs.forzar }}" != "si" ] && grep -q "^## Franja ${FRANJA}:00" "$f" 2>/dev/null; then
            echo "hecho=si" >> "$GITHUB_OUTPUT"; echo "La franja $FRANJA ya se publicó hoy: no se repite."
          fi
          # GitHub sometimes fires a cron hours late: outside its window (Ecuador time) a scheduled run does nothing,
          # so a late franja 19 never publishes after midnight as the next day's "19:00"
          h=$((10#$(TZ=America/Guayaquil date +%H)))
          if [ "${{ github.event_name }}" = schedule ] && { { [ "$FRANJA" = 12 ] && [ $h -lt 10 -o $h -ge 17 ]; } || { [ "$FRANJA" = 19 ] && [ $h -lt 17 ]; }; }; then
            echo "hecho=si" >> "$GITHUB_OUTPUT"; echo "Cron retrasado ($h h) fuera de la ventana de la franja $FRANJA: no se publica."
          fi

  publicar:
    needs: comprobar
    if: needs.comprobar.outputs.hecho != 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FRANJA: ${{ github.event.inputs.franja || (contains(github.event.schedule, ' 15 ') || contains(github.event.schedule, ' 16 ')) && '12' || '19' }}
      TZ: America/Guayaquil
      GH_TOKEN: ${{ secrets.DATOS_PAT }}
      DATOS_REPO: ${{ vars.DATOS_REPO }}
      CANAL_PAT: ${{ secrets.CANAL_PAT }}
      YT_AUDITORIA_OK: ${{ vars.YT_AUDITORIA_OK }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATOS_REPO }}
          token: ${{ secrets.DATOS_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Caché de modelos de voz y ASR
        uses: actions/cache@v4
        with:
          path: ~/.local/share/gnuxdar-video-tools/models
          key: modelos-v2

      - name: Caché de paquetes de node
        uses: actions/cache@v4
        with:
          path: scripts/node_modules
          key: node-${{ hashFiles('scripts/package.json') }}

      - name: Preparar la máquina
        run: bash automatizacion/setup_ci.sh

      - name: Credenciales
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_TOKEN: ${{ secrets.TT_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          mkdir -p credenciales && chmod 700 credenciales
          printf 'IG_USER_ID=%s\nIG_ACCESS_TOKEN=%s\nTT_CLIENT_KEY=%s\nTT_CLIENT_SECRET=%s\nFB_PAGE_ID=%s\nFB_PAGE_TOKEN=%s\n' "$IG_USER_ID" "$IG_ACCESS_TOKEN" "$TT_CLIENT_KEY" "$TT_CLIENT_SECRET" "$FB_PAGE_ID" "$FB_PAGE_TOKEN" > credenciales/claves.env
          printf '%s' "$YT_CLIENT_SECRET" > credenciales/youtube_client_secret.json
          printf '%s' "$YT_TOKEN" > credenciales/youtube_token.json
          # TikTok is optional until it is connected: no secret, no token file, and the prompt skips it
          [ -z "$TT_TOKEN" ] || printf '%s' "$TT_TOKEN" > credenciales/tiktok_token.json
          chmod 600 credenciales/*
          sha256sum credenciales/tiktok_token.json 2>/dev/null > /tmp/tt_token.sha || true

      - name: Seguimiento de crecimiento (una vez al día)
        if: env.FRANJA == '12'
        run: python3 -I scripts/seguimiento.py credenciales/youtube_client_secret.json credenciales/youtube_token.json credenciales/claves.env cerebro-youtube > salida_seguimiento.log 2>&1 || echo "::warning::falló el seguimiento (detalle solo en el runner)"

      - name: Claude produce y publica
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null
          mkdir -p salida
          claude -p "$(cat automatizacion/prompt-diario.md)" \
            --model claude-sonnet-5-5 \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch" \
            --max-turns 250 > salida/claude.log 2>&1 \
            && echo "Claude terminó bien" || { echo "::error::Claude falló (detalle en el registro privado)"; exit 1; }

      - name: Guardar el token de TikTok renovado
        # TikTok may hand out a new refresh token on every refresh; keep the latest one or the next run cannot log in
        if: always() && hashFiles('credenciales/tiktok_token.json') != ''
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          sha256sum -c --quiet /tmp/tt_token.sha 2>/dev/null && { echo "token de TikTok sin cambios"; exit 0; }
          [ -n "$GH_TOKEN" ] || { echo "::error::falta SECRETS_PAT para guardar el token de TikTok"; exit 1; }
          gh secret set TT_TOKEN -R "$GITHUB_REPOSITORY" < credenciales/tiktok_token.json
          echo "token de TikTok actualizado en el secreto TT_TOKEN"

      - name: Guardar cambios del cerebro y la cola
        if: always()
        run: |
          git config user.name "AC Tecnology Bot"
          git config user.email "ac-tecnology-bot@users.noreply.github.com"
          # one pathspec per call: a pattern with no match must not stop the others from being added
          mkdir -p automatizacion/registro/claude && cp salida/claude.log "automatizacion/registro/claude/$(date +%F_%H%M).log" 2>/dev/null || true
          for p in cerebro-youtube cola automatizacion/registro "produccion/*/guion.py" "produccion/*/publicado"; do git add $p 2>/dev/null || true; done
          git diff --cached --quiet || { git commit -m "Franja $FRANJA: $(date +%Y-%m-%d)"; git pull --rebase --autostash -q && git push -q; }
